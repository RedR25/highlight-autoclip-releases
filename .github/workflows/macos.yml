name: macOS build

# Builds only Highlight Autoclip's macOS app (Apple Silicon; ad-hoc signed, not notarized), from the
# private source repo, on GitHub's free macOS runner, onto the version's draft release. It holds no
# signing key: the owner's computer signs the update manifest and publishes the release
# (scripts/release.mjs in the source repo). The source is read through a read-only deploy key.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source commit to build"
        required: true
      version:
        description: "Version, e.g. 1.0.2"
        required: true

permissions:
  contents: write # the draft release's files

jobs:
  build:
    # macOS 15 on Apple Silicon: GitHub retired the macOS 14 runner. The app still runs on 14 (PyAV's
    # wheels): "Check the backend loads on macOS 14" below fails a build that wouldn't.
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: highlight-autoclip-tool
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: RedR25/standup-comedy-tools
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: highlight-autoclip-tool/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: |
          npm ci
          npm run py:setup

      # Verbose and bounded: a stuck test shows by name instead of running to the job limit.
      - name: Test
        timeout-minutes: 45
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          node --test tests/*.test.ts
          uv run --project python python -m unittest discover -v -s python -p "test_*.py"

      - name: Package
        run: npm run build:mac -- -c.extraMetadata.version="$VERSION"

      # Every binary of the backend must load on macOS 14: one built for a newer macOS (a Homebrew
      # Python's pyexpat once) fails there at run time, not at install.
      - name: Check the backend loads on macOS 14
        run: |
          find python/dist/backend -type f \( -name "*.so" -o -name "*.dylib" -o -perm -u+x \) -exec otool -l {} + 2>/dev/null |
            awk '/^python\/dist\/backend\/.*:$/ { f = $0 } $1 == "minos" && $2 + 0 > 14 { print "::error::" f " needs macOS " $2; bad = 1 } END { exit bad }'

      # Onto the draft release the owner's computer made: it signs the manifest from GitHub's size and SHA-256 of each
      # file, so the builds never pass through it.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/*-macos-arm64.dmg dist/*-macos-arm64.zip --clobber --repo "$GITHUB_REPOSITORY"
