name: Windows debug (temporary)

# Temporary: reproduces a clip export failure with the released Windows build. Removed when done.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Comma-separated cases (download,fresh,long,holders,fix); empty = all"
        required: false
        default: ""
      longpaths:
        description: "LongPathsEnabled to set before the run (keep, 0 or 1)"
        required: false
        default: "keep"
      defender:
        description: "Turn on Defender real-time protection first (on or keep)"
        required: false
        default: "keep"

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: "3.12"

      - name: Machine facts
        timeout-minutes: 3
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled | Select-Object LongPathsEnabled
          "Videos: " + [Environment]::GetFolderPath('MyVideos')
          "ACP: " + (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage).ACP
          Get-WinSystemLocale

      - name: Set LongPathsEnabled
        if: inputs.longpaths != 'keep'
        timeout-minutes: 2
        shell: pwsh
        run: |
          Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value ${{ inputs.longpaths }}
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled | Select-Object LongPathsEnabled

      - name: Turn on Defender real-time protection
        if: inputs.defender == 'on'
        timeout-minutes: 5
        shell: pwsh
        run: |
          Remove-Item 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender' -Recurse -ErrorAction SilentlyContinue
          $p = Get-MpPreference
          if ($p.ExclusionPath) { Remove-MpPreference -ExclusionPath $p.ExclusionPath -ErrorAction Continue }
          if ($p.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $p.ExclusionProcess -ErrorAction Continue }
          if ($p.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $p.ExclusionExtension -ErrorAction Continue }
          Set-MpPreference -DisableRealtimeMonitoring $false -DisableBehaviorMonitoring $false -DisableIOAVProtection $false -ErrorAction Continue
          Start-Sleep -Seconds 10
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, OnAccessProtectionEnabled, IoavProtectionEnabled, BehaviorMonitorEnabled | Format-List
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath, ExclusionProcess | Format-List

      - name: Install Highlight Autoclip 1.0.4
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.4 -R $env:GITHUB_REPOSITORY -p '*windows-x64-setup.exe' -D "$env:RUNNER_TEMP\setup"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\setup\*.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $backend = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter backend.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $install = $backend.Directory.Parent.Parent.FullName
          "Installed at $install"
          Get-ChildItem $install | Select-Object Name
          "INSTALL_DIR=$install" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VIDEOS_DIR=$([Environment]::GetFolderPath('MyVideos'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Drive the backend
        timeout-minutes: 30
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          CASES: ${{ inputs.cases }}
        run: python -X utf8 debug/drive.py "$env:INSTALL_DIR"
